# LiteLLM Proxy config for the Model API.
#
#   litellm --config model_api/proxy_config.yaml --port 8090 --telemetry False
#
# Model Provider credentials stay on the server. Gooey code runs through
# custom_auth (model_api/gooey_auth.py) and the callbacks in model_api/hooks.py,
# which rewrite the client's native model ID to `provider/model` before routing
# and bill each call. Module paths are relative to this file.

model_list:
  # one wildcard route per Model Provider in model_api/routing.py:MODEL_PROVIDERS
  - model_name: "openai/*"
    litellm_params:
      model: "openai/*"
      api_key: os.environ/OPENAI_API_KEY

litellm_settings:
  drop_params: true
  num_retries: 0
  request_timeout: 600
  callbacks: hooks.gooey_model_api

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  custom_auth: gooey_auth.user_api_key_auth
