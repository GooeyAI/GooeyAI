# LiteLLM Proxy config for the Model API.
#
#   litellm --config model_api/proxy_config.yaml --port 8090 --telemetry False
#
# Model Provider credentials stay on the server. Gooey code runs through
# custom_auth (model_api/gooey_auth.py); module paths are relative to this file.

model_list:
  # native OpenAI IDs as clients send them (gpt-4.1-mini, o3, ...), by the name
  # prefixes of OpenAI's chat models; any other OpenAI model as openai/<id>
  # TODO: replace with real native-ID resolution and a pricing gate (ticket 04)
  - model_name: "gpt-*"
    litellm_params:
      model: "openai/gpt-*"
      api_key: os.environ/OPENAI_API_KEY
  - model_name: "o1*"
    litellm_params:
      model: "openai/o1*"
      api_key: os.environ/OPENAI_API_KEY
  - model_name: "o3*"
    litellm_params:
      model: "openai/o3*"
      api_key: os.environ/OPENAI_API_KEY
  - model_name: "o4*"
    litellm_params:
      model: "openai/o4*"
      api_key: os.environ/OPENAI_API_KEY
  - model_name: "chatgpt-*"
    litellm_params:
      model: "openai/chatgpt-*"
      api_key: os.environ/OPENAI_API_KEY
  - model_name: "codex-*"
    litellm_params:
      model: "openai/codex-*"
      api_key: os.environ/OPENAI_API_KEY
  - model_name: "openai/*"
    litellm_params:
      model: "openai/*"
      api_key: os.environ/OPENAI_API_KEY

litellm_settings:
  drop_params: true
  num_retries: 0
  request_timeout: 600

general_settings:
  # no master_key: custom_auth runs before any master-key check, and every
  # route outside the key's allowed_routes is closed.
  # TODO: LiteLLM >= 1.101 refuses to start without one; add it back then
  custom_auth: gooey_auth.user_api_key_auth
  # TODO: credit reservation and billing hooks (tickets 05-07)
